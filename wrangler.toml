name = "pais-gourmet"
compatibility_date = "2026-01-01"

[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# Límite más generoso para endpoints de escritura ya autenticados (import/fotos/preview del
# panel admin): defensa en profundidad por si una sesión se filtra o un script autenticado abusa.
[[unsafe.bindings]]
name = "RATE_LIMITER_WRITE"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 30, period = 60 }
